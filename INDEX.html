<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treni Portici-Ercolano → Napoli</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #0056b3; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #666; font-size: 0.9em; margin-bottom: 20px; }
        .btn { display: block; width: 100%; padding: 12px; background-color: #0056b3; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin-bottom: 20px; }
        .btn:hover { background-color: #004494; }
        .btn:disabled { background-color: #ccc; cursor: not-allowed; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 10px; background-color: #e9ecef; color: #495057; font-size: 0.85em; text-transform: uppercase; }
        td { padding: 12px 10px; border-bottom: 1px solid #eee; font-size: 0.95em; }
        .ritardo { color: #d9534f; font-weight: bold; }
        .orario { color: #28a745; font-weight: bold; }
        .loading { text-align: center; padding: 20px; color: #666; display: none; }
        .error { text-align: center; padding: 20px; color: #d9534f; background: #f9e2e2; border-radius: 8px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>🚆 Portici-Ercolano → Napoli</h1>
    <p class="subtitle">Dati in tempo reale da RFI</p>
    
    <button class="btn" id="refreshBtn" onclick="caricaTreni()">🔄 Aggiorna Orari</button>
    
    <div id="loading" class="loading">Caricamento in corso...</div>
    <div id="error" class="error"></div>

    <table id="tabellaTreni">
        <thead>
            <tr>
                <th>Ora</th>
                <th>Treno</th>
                <th>Destinazione</th>
                <th>Bin.</th>
                <th>Stato</th>
            </tr>
        </thead>
        <tbody id="corpoTabella">
            <!-- I treni verranno inseriti qui da JavaScript -->
        </tbody>
    </table>
</div>

<script>
    async function caricaTreni() {
        const btn = document.getElementById('refreshBtn');
        const loading = document.getElementById('loading');
        const error = document.getElementById('error');
        const corpo = document.getElementById('corpoTabella');

        btn.disabled = true;
        loading.style.display = 'block';
        error.style.display = 'none';
        corpo.innerHTML = '';

        try {
            // Chiama la nostra Netlify Function
            const response = await fetch('/.netlify/functions/get-treni');
            const data = await response.json();

            if (!response.ok || data.error) {
                throw new Error(data.error || 'Errore nel recupero dati');
            }

            if (data.treni.length === 0) {
                corpo.innerHTML = '<tr><td colspan="5" style="text-align:center;">Nessun treno trovato a breve.</td></tr>';
            } else {
                data.treni.forEach(t => {
                    const riga = document.createElement('tr');
                    const classeRitardo = t.ritardo && t.ritardo !== 'In orario' ? 'ritardo' : 'orario';
                    riga.innerHTML = `
                        <td><strong>${t.orario}</strong></td>
                        <td>${t.treno}</td>
                        <td>${t.destinazione}</td>
                        <td>${t.binario || '-'}</td>
                        <td class="${classeRitardo}">${t.ritardo || 'In orario'}</td>
                    `;
                    corpo.appendChild(riga);
                });
            }
        } catch (err) {
            error.textContent = '⚠️ Impossibile caricare i dati: ' + err.message;
            error.style.display = 'block';
        } finally {
            btn.disabled = false;
            loading.style.display = 'none';
        }
    }

    // Carica i treni automaticamente all'apertura della pagina
    window.onload = caricaTreni;
</script>

</body>
</html>
